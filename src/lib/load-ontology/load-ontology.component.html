<div class="home-card__row">
    <div class="action-with-help">
        <button (click)="onLoad.emit()" [disabled]="isLoading()" class="btn-outline-primary home-card__action-btn">
            @if (isLoading()) {
                <span class="custom-spinner" aria-hidden="true"></span>
                <span>Loading...</span>
            } @else {
                <span>Load {{ label() }}</span>
            }
        </button>
        
        <hpo-help-button 
            [title]="'Loading the ' + label()" 
            [lines]="helpLines()" 
            [helpUrl]="helpUrl()" />
    </div>
    
    <div class="ontology-status">
        <span [ngClass]="{
            'ontology-status__text--loading': isLoading(), 
            'ontology-status__text--loaded': isLoaded()}" 
            class="ontology-status__text">
            @if(isLoaded()) {
                <svg class="ontology-status__icon" xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 -960 960 960" width="18" fill="currentColor">
                    <path d="m424-296 282-282-56-56-226 226-114-114-56 56 170 170Zm56 216q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-80q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/>
                </svg> 
                {{ statusMessage() }}
                <span class="ontology-status__terms">{{ termCount() }} terms available</span>
            }
        </span>
    </div>
</div>
